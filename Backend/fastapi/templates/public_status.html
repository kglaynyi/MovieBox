{% extends "base.html" %}
{% block title %}Server Status - NLYNN{% endblock %}
{% block content %}
<section class="max-w-2xl mx-auto rounded-3xl border border-white/10 p-6 space-y-4">
    <h1 class="text-3xl font-bold">Server Status</h1>
    <p>Status: <strong>{{ stats.status | capitalize }}</strong></p>
    <p>Library titles: {{ stats.total_content }}</p>
    <p>Configured databases: {{ stats.databases_online }}</p>
    <a href="/login" class="text-primary underline">Administrator login</a>
</section>
{% endblock %}
